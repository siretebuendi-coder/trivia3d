<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isla Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
<div class="cloud" style="top:8%;width:160px;height:44px;animation-duration:70s"></div>
<div class="cloud" style="top:20%;width:110px;height:30px;animation-duration:95s;animation-delay:-40s"></div>
<div class="cloud" style="top:34%;width:200px;height:52px;animation-duration:120s;animation-delay:-70s"></div>
<div class="sea"></div>
<div class="home-wrap">
  <div class="logo">Isla<br>Trivia</div>
  <p class="tagline">Sube a la cima de la isla respondiendo preguntas, tirando el dado y esquivando monstruos. ¡Jugad en equipos desde el móvil!</p>
  <div class="features"><span>🎲 Dado 3D</span><span>👹 Monstruos</span><span>⭐ Casillas bonus</span><span>👥 2-4 equipos</span><span>📱 Con el móvil</span></div>
  <div class="card panel">
    <h2>📺 En la tele o el ordenador</h2>
    <a class="btn green big" href="host.html" id="newroom">Crear sala</a>
    <div class="or">— y los demás —</div>
    <h2>📱 En tu móvil</h2>
    <form class="codein" action="play.html" method="get">
      <input name="c" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" required>
      <button class="btn">Entrar</button>
    </form>
  </div>
</div>
<script>
  // "Crear sala" siempre empieza una sala nueva
  document.getElementById('newroom').addEventListener('click', function () {
    try { sessionStorage.removeItem('isla-room'); } catch (e) {}
  });
</script>
</body>
</html>
